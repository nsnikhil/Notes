apply plugin: 'com.android.application'
apply plugin: 'jacoco'
apply plugin: 'com.google.android.gms.oss-licenses-plugin'
apply plugin: 'androidx.navigation.safeargs'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'kotlin-kapt'
apply plugin: 'kotlinx-serialization'

jacoco {
    toolVersion = "0.8.12"
}

task jacocoTestReport(type: JacocoReport, dependsOn: ['testDemoDebugUnitTest']) {
    group = "Reporting"
    description = "Generate JaCoCo coverage report for demoDebug unit tests."

    reports {
        xml.required = true
        html.required = true
    }

    def fileFilter = [
            '**/R.class', '**/R$*.class', '**/BuildConfig.*',
            '**/Manifest*.*', '**/*Test*.*', 'android/**/*.*',
            '**/*_MembersInjector.class', '**/Dagger*Component*.class',
            '**/Dagger*Builder.class', '**/*Module_*Factory.class',
            '**/*_Factory.class', '**/*_Provide*Factory*.*',
            '**/*_ViewBinding*.*', '**/databinding/*.*'
    ]

    def debugTree = fileTree(
            dir: "${buildDir}/intermediates/javac/demoDebug/classes",
            excludes: fileFilter
    ) + fileTree(
            dir: "${buildDir}/tmp/kotlin-classes/demoDebug",
            excludes: fileFilter
    )

    def mainSrc = "${project.projectDir}/src/main/kotlin"

    sourceDirectories.setFrom(files([mainSrc, "${project.projectDir}/src/main/java"]))
    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(dir: buildDir, includes: [
            'jacoco/testDemoDebugUnitTest.exec'
    ]))
}

android {
    namespace "com.nrs.nsnik.notes"
    compileSdk 35
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId "com.nrs.nsnik.notes"
        minSdk 23
        targetSdk 34
        versionCode 42
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resConfigs "en"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
        resValue "string", "GOOGLE_GMS_AD_APPLICATION_ID", GOOGLE_GMS_AD_APPLICATION_ID
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
        main.java.srcDirs += 'src/main/kotlin'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        debug {
        }
        release {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "version"
    productFlavors {
        demo {
            dimension "version"
            applicationIdSuffix ".demo"
            versionNameSuffix "-demo"
        }
        full {
            dimension "version"
            applicationIdSuffix ".full"
            versionNameSuffix "-full"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
        unitTests.includeAndroidResources = true
    }

    kapt {
        correctErrorTypes = true
        useBuildCache = true
    }

    lint {
        abortOnError false
    }

    packaging {
        resources {
            excludes += 'META-INF/proguard/androidx-annotations.pro'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation" << "-Xlint:cast" << "-Xlint:empty" << "-Xmaxerrs" << "500"
}

